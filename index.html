<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101a2c">
<title>SWING — Keep Your Momentum</title>
<style>
:root{--ink:#f4f7ff;--muted:#9fb0c8;--cyan:#66f0dc;--gold:#ffd36a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a2c;color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
body{position:fixed;inset:0}
#game{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;inset:env(safe-area-inset-top) 0 auto 0;padding:calc(12px + env(safe-area-inset-top)) 18px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.stat{display:flex;flex-direction:column;gap:2px;text-shadow:0 2px 10px #07101dcc}
.stat small{font-size:10px;letter-spacing:2px;font-weight:900;color:#a9bbd1}
.stat strong{font-size:25px;line-height:1;font-weight:950;letter-spacing:-1px}
#rightHud{display:flex;gap:10px;align-items:center;pointer-events:auto}
.pill{border:1px solid #ffffff28;background:#101a2c88;color:white;border-radius:999px;padding:9px 13px;font-weight:850;font-size:12px;backdrop-filter:blur(8px)}
#hint{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;letter-spacing:1.4px;color:#d8e7f6;background:#101a2c88;border:1px solid #ffffff20;border-radius:999px;padding:11px 17px;white-space:nowrap;pointer-events:none;text-shadow:0 2px 8px #000}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#08122135,#081221a8);backdrop-filter:blur(3px)}
.panel{width:min(420px,100%);text-align:center;padding:30px 23px 25px;border:1px solid #ffffff25;border-radius:28px;background:linear-gradient(150deg,#1e3047ee,#111d31f2);box-shadow:0 24px 80px #0008}
.eyebrow{color:var(--cyan);font-size:11px;font-weight:950;letter-spacing:4px;margin-bottom:10px}
h1{font-size:clamp(48px,15vw,76px);line-height:.9;letter-spacing:-5px;margin:0 0 14px;font-weight:1000;font-style:italic}
h1 span{color:var(--cyan)}
#message{color:#c0cee0;font-size:14px;line-height:1.55;margin:0 auto 20px;max-width:290px}
.bigbtn{width:100%;border:0;border-radius:16px;padding:17px 20px;background:linear-gradient(135deg,#74f4df,#34cbbd);color:#09202a;font-weight:1000;font-size:15px;letter-spacing:1.4px;box-shadow:0 8px 0 #168f8c;cursor:pointer}
.bigbtn:active{transform:translateY(4px);box-shadow:0 4px 0 #168f8c}
.sub{margin-top:16px;color:#8fa3bd;font-size:11px;line-height:1.5}
#pauseBtn{display:none}
#toast{position:absolute;top:22%;left:50%;transform:translate(-50%,-10px);opacity:0;color:#ffe18a;font-weight:1000;letter-spacing:2px;text-shadow:0 3px 12px #000;pointer-events:none;transition:.2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-aspect-ratio: .8/1){.panel{max-width:390px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="stat"><small>DISTANCE</small><strong id="score">0m</strong></div>
  <div id="rightHud"><div class="stat" style="text-align:right"><small>BEST RUN</small><strong id="best">0m</strong></div><button class="pill" id="pauseBtn">Ⅱ</button></div>
</div>
<div id="hint">HOLD TO GRAB · RELEASE TO FLY</div>
<div id="toast">NICE SWING!</div>
<div id="overlay">
  <div class="panel">
    <div class="eyebrow">A MOMENTUM ARCADE GAME</div>
    <h1>SW<span>ING</span></h1>
    <p id="message">Catch a line. Build speed. Let go at the perfect moment. How far can you fly?</p>
    <button class="bigbtn" id="startBtn">START SWINGING</button>
    <div class="sub">HOLD ANYWHERE TO GRAB A PASSING ANCHOR<br>RELEASE TO LAUNCH · DON'T HIT THE GROUND</div>
  </div>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn'),message=document.getElementById('message'),hint=document.getElementById('hint'),pauseBtn=document.getElementById('pauseBtn'),toast=document.getElementById('toast');
let W=0,H=0,DPR=1,last=0,raf=0,state='menu',camera=0,distance=0,best=+(localStorage.getItem('swingBest')||0),time=0,shake=0,toastTimer=0;
bestEl.textContent=best+'m';
const player={x:100,y:300,px:100,py:300,vx:210,vy:0,r:13,rope:null,trail:[]};
let anchors=[],buildings=[],coins=[],particles=[],held=false,worldEnd=0,spawnX=0,combo=0,air=0;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);if(state==='menu'||state==='dead'){player.x=W*.25;player.y=H*.42;}}
addEventListener('resize',resize);resize();
function groundY(x){return H*.83+Math.sin(x*.002)*H*.018}
function addAnchor(x,y){anchors.push({x,y,r:9,used:false});}
function generate(from,to){
 let x=from;
 while(x<to){
   const gap=rand(145,220),bw=rand(85,145),bh=rand(H*.22,H*.48);
   const top=H*.79-bh;
   buildings.push({x:x+gap,w:bw,top,shade:Math.random()});
   addAnchor(x+gap+bw*.52,top-rand(55,95));
   if(Math.random()<.8)addAnchor(x+gap+bw+rand(65,105),top-rand(95,155));
   if(Math.random()<.7)coins.push({x:x+gap+bw+rand(35,80),y:top-rand(40,105),got:false,r:8});
   x+=gap+bw;
 }
 spawnX=x; 
}
function reset(){
 camera=0;distance=0;time=0;shake=0;combo=0;air=0;held=false;particles=[];
 player.x=W*.22;player.y=H*.4;player.px=player.x;player.py=player.y;player.vx=220;player.vy=0;player.rope=null;player.trail=[];
 anchors=[];buildings=[];coins=[];generate(0,W*3.2);scoreEl.textContent='0m';
}
function start(){reset();state='play';overlay.style.display='none';hint.style.display='block';pauseBtn.style.display='block';last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);}
function end(){if(state!=='play')return;state='dead';held=false;player.rope=null;shake=15;best=Math.max(best,distance);localStorage.setItem('swingBest',best);bestEl.textContent=best+'m';pauseBtn.style.display='none';hint.style.display='none';message.innerHTML=`You travelled <b style="color:#66f0dc">${distance}m</b>. ${distance>best-1?'New personal best?':''}<br><br>One more run. You know you can beat it.`;startBtn.textContent='RUN IT BACK';overlay.style.display='flex';}
function pause(){if(state==='play'){state='paused';held=false;}else if(state==='paused'){state='play';last=performance.now();raf=requestAnimationFrame(loop);}if(state==='paused'){message.textContent='Take a breath. Your next perfect swing is waiting.';startBtn.textContent='RESUME';overlay.style.display='flex';hint.style.display='none';pauseBtn.textContent='▶';}}
function resume(){if(state==='paused'){overlay.style.display='none';hint.style.display='block';pauseBtn.textContent='Ⅱ';state='play';last=performance.now();raf=requestAnimationFrame(loop);}}
startBtn.addEventListener('click',()=>{if(state==='paused')resume();else start();});pauseBtn.addEventListener('click',pause);
function worldX(sx){return sx+camera}
function nearestAnchor(){
 let bestA=null,bd=Infinity;
 for(const a of anchors){if(a.used)continue;const dx=a.x-player.x,dy=a.y-player.y,d=Math.hypot(dx,dy);if(dx>-25&&dx<Math.min(W*.82,360)&&d<bd&&d<Math.min(H*.72,470)){bestA=a;bd=d;}}
 return bestA;
}
function grab(){if(state!=='play')return;held=true;if(!player.rope){const a=nearestAnchor();if(a){const dx=player.x-a.x,dy=player.y-a.y;player.rope={a,len:clamp(Math.hypot(dx,dy),65,Math.min(H*.68,300))};a.used=true;spark(a.x,a.y,10,'#66f0dc');}}}
function release(){held=false;if(player.rope){const speed=Math.hypot(player.vx,player.vy);player.vx+=Math.sign(player.vx||1)*Math.min(90,speed*.14);player.vy-=18;player.rope=null;combo++;air=0;}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture?.(e.pointerId);grab();});
canvas.addEventListener('pointerup',e=>{e.preventDefault();release();});
canvas.addEventListener('pointercancel',release);
function spark(x,y,n,color){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-150,150),vy:rand(-160,80),life:rand(.25,.6),max:.6,color,r:rand(2,4)});}
function showToast(txt){toast.textContent=txt;toast.classList.add('show');toastTimer=.8;}
function update(dt){
 time+=dt;const p=player;
 const gravity=H*1.55;
 p.px=p.x;p.py=p.y;
 // forward auto-run keeps the challenge moving; rope physics supplies the satisfying swing.
 if(p.rope){
   const a=p.rope.a;
   const dx=p.x-a.x,dy=p.y-a.y,dist=Math.hypot(dx,dy)||1;
   const nx=dx/dist,ny=dy/dist;
   p.vy+=gravity*dt;
   p.vx+=18*dt;
   p.x+=p.vx*dt;p.y+=p.vy*dt;
   const rx=p.x-a.x,ry=p.y-a.y,rd=Math.hypot(rx,ry)||1;
   if(rd>p.rope.len){
     const ux=rx/rd,uy=ry/rd;
     p.x=a.x+ux*p.rope.len;p.y=a.y+uy*p.rope.len;
     const radial=p.vx*ux+p.vy*uy;
     if(radial>0){p.vx-=radial*ux;p.vy-=radial*uy;}
     // Slight energy preservation makes the pendulum feel weighty, not floaty.
     p.vx*=.999;p.vy*=.999;
   }
 }else{
   p.vy+=gravity*dt;
   p.vx+=(300-p.vx)*.24*dt;
   p.x+=p.vx*dt;p.y+=p.vy*dt;
 }
 // Keep the runner in the left third while the world scrolls.
 const targetX=camera+W*.27;
 if(p.x>targetX){camera+=(p.x-targetX)*.12;p.x-= (p.x-targetX)*.12;}
 if(p.x<camera+W*.12){p.x=camera+W*.12;p.vx=Math.max(p.vx,160);}
 distance=Math.max(distance,Math.floor(camera/10));
 scoreEl.textContent=distance+'m';
 if(camera+W*3>spawnX)generate(spawnX,camera+W*4);
 anchors=anchors.filter(a=>a.x>camera-250);
 buildings=buildings.filter(b=>b.x+b.w>camera-250);
 coins=coins.filter(c=>c.x>camera-100&&!c.got);
 for(const c of coins){if(Math.hypot(c.x-p.x,c.y-p.y)<p.r+c.r+5){c.got=true;distance+=5;spark(c.x,c.y,14,'#ffd36a');showToast('+5 BONUS');}}
 if(p.y+p.r>groundY(p.x)){p.y=groundY(p.x)-p.r;end();}
 if(p.y<-H*.3){p.vy=80;}
 p.trail.push({x:p.x,y:p.y});if(p.trail.length>12)p.trail.shift();
 for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=260*dt;q.life-=dt;}
 particles=particles.filter(q=>q.life>0);
 if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)toast.classList.remove('show');}
 shake=Math.max(0,shake-35*dt);
}
function draw(){
 ctx.save();if(shake){ctx.translate(rand(-shake,shake),rand(-shake,shake));}
 const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#14233b');sky.addColorStop(.58,'#294966');sky.addColorStop(1,'#f09a79');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 // distant haze and tiny stars
 for(let i=0;i<35;i++){const x=((i*173-camera*.08)%(W+30)+W+30)%(W+30),y=(i*79)%Math.max(1,H*.55);ctx.fillStyle=`rgba(255,255,255,${.18+(i%3)*.1})`;ctx.fillRect(x,y,2,2);}
 // distant skyline
 for(let i=0;i<18;i++){let x=((i*125-camera*.22)%(W+150)+W+150)%(W+150)-50;let bh=H*(.12+(i*37%17)/100);ctx.fillStyle='#1a3448';ctx.fillRect(x,H*.79-bh,75,bh);}
 ctx.save();ctx.translate(-camera,0);
 // buildings
 for(const b of buildings){ctx.fillStyle=b.shade>.5?'#203b4b':'#284858';ctx.fillRect(b.x,b.top,b.w,H-b.top);ctx.fillStyle='#395e68';ctx.fillRect(b.x,b.top,b.w,7);
  for(let yy=b.top+22;yy<H*.77;yy+=27)for(let xx=b.x+12;xx<b.x+b.w-8;xx+=24){ctx.fillStyle=((xx+yy)%3<1)?'#f8cb7a66':'#8ed6d055';ctx.fillRect(xx,yy,8,11);}
  // roof anchor post
  ctx.strokeStyle='#9bb9b9';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b.x+b.w*.52,b.top);ctx.lineTo(b.x+b.w*.52,b.top-15);ctx.stroke();
 }
 // ground
 ctx.fillStyle='#102b35';ctx.beginPath();ctx.moveTo(camera,H);for(let x=camera;x<camera+W+30;x+=15)ctx.lineTo(x,groundY(x));ctx.lineTo(camera+W+30,H);ctx.fill();
 // anchors
 for(const a of anchors){ctx.beginPath();ctx.arc(a.x,a.y,10+Math.sin(time*5+a.x)*1.5,0,Math.PI*2);ctx.fillStyle='#66f0dc';ctx.fill();ctx.beginPath();ctx.arc(a.x,a.y,17,0,Math.PI*2);ctx.strokeStyle='#66f0dc55';ctx.lineWidth=2;ctx.stroke();}
 // coins
 for(const c of coins){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(time*2);ctx.fillStyle='#ffd36a';ctx.beginPath();ctx.ellipse(0,0,6,10,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff0b8';ctx.lineWidth=2;ctx.stroke();ctx.restore();}
 // rope
 if(player.rope){const a=player.rope.a;ctx.strokeStyle='#d9f6ed';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(player.x,player.y);ctx.stroke();ctx.strokeStyle='#66f0dc55';ctx.lineWidth=7;ctx.stroke();}
 // player trail
 for(let i=0;i<player.trail.length;i++){const t=player.trail[i],alpha=i/player.trail.length;ctx.fillStyle=`rgba(102,240,220,${alpha*.24})`;ctx.beginPath();ctx.arc(t.x,t.y,player.r*alpha*.75,0,Math.PI*2);ctx.fill();}
 // character: compact, chunky silhouette with scarf
 ctx.save();ctx.translate(player.x,player.y);ctx.rotate(clamp(player.vy/650,-.65,.9));
 ctx.fillStyle='#ffcb72';ctx.beginPath();ctx.arc(0,0,player.r,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#243548';ctx.beginPath();ctx.arc(4,-3,2.6,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#ff6e74';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-8,4);ctx.quadraticCurveTo(-18,7,-25,1+Math.sin(time*18)*4);ctx.stroke();
 ctx.restore();
 ctx.restore();
 for(const q of particles){ctx.globalAlpha=clamp(q.life/q.max,0,1);ctx.fillStyle=q.color;ctx.beginPath();ctx.arc(q.x-camera,q.y,q.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
 ctx.restore();
}
function loop(now){if(state!=='play')return;const dt=Math.min((now-last)/1000,.033);last=now;update(dt);draw();if(state==='play')raf=requestAnimationFrame(loop);}
function menuDraw(){reset();draw();}
menuDraw();
})();
</script>
</body>
</html>
